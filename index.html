<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090a"><title>Halloween Tag</title><link rel="icon" href="data:,"><style>* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090a; color: #e9e6df; font-family: ui-monospace, monospace; }
#world, #world canvas { display: block; width: 100%; height: 100%; touch-action: none; }

button:focus-visible { outline: 2px solid #d39c59; outline-offset: 3px; }

#connection { font-size: 10px; color: #ddd5c8; padding: 7px; text-shadow: 0 1px 5px #000; }
#notice { position: fixed; left: 16px; right: 16px; top: max(16px, env(safe-area-inset-top)); padding: 12px 15px; background: #171918eb; border-left: 2px solid #ce8b40; font-size: 12px; line-height: 1.6; max-width: 720px; }

[hidden] { display: none !important; }
@media (max-width: 520px) { button { padding: 11px; } #connection { flex-basis: 100%; font-size: 9px; } }
